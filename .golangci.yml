# golangci-lint v2 config. Replaces the dormant v1.21-era enable list
# (golint/structcheck/varcheck/deadcode are gone; revive replaces golint).
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    gocyclo:
      min-complexity: 30
    goconst:
      min-len: 2
      min-occurrences: 2
    misspell:
      locale: US
    revive:
      confidence: 0.8
  exclusions:
    paths:
      - .gen
      - third_party$
      - builtin$
      - examples$
    rules:
      - path: '.*_gen\.go$'
        text: ".*"

formatters:
  enable:
    - gofmt
    - goimports
