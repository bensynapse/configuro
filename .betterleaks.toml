# positives (example keys, test fixtures), never real secrets.
# Docs: https://github.com/betterleaks/betterleaks

[extend]
useDefault = true

[allowlist]
description = "Repo-wide allowlist for known-safe matches."

paths = [
    # '''example/.*''',
]

regexes = [
    # '''AKIAEXAMPLE[0-9A-Z]+''',
]

stopwords = [
    # "example",
]
